<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autopartes del Sur</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ARQUITECTURA DEL FRONTEND
       index.html  → estructura fija (menú, barra, tabla, diálogos)
       js/app.js   → arranque, menú, rutas (#/pedidos) y carga de datos
       js/table.js → dibuja la tabla de cualquier módulo
       js/form.js  → dibuja el formulario modal de cualquier módulo
       js/api.js   → única capa que habla con el servidor
       js/ui.js    → alertas, formato de fechas y utilidades
       Todo se construye a partir de GET /api/meta: no hay una pantalla por tabla. -->
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AS</span>
        <span class="brand-name">Autopartes<br />del Sur</span>
      </div>
      <nav id="nav" aria-label="Módulos"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button id="btn-menu" class="btn btn-ghost btn-icon" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">☰</button>
        <h1 id="page-title">Cargando…</h1>
      </header>

      <main class="content">
        <section class="toolbar">
          <div class="search">
            <span aria-hidden="true">🔍</span>
            <input id="search" type="search" placeholder="Buscar…" aria-label="Buscar" autocomplete="off" disabled />
          </div>
          <button id="btn-new" class="btn btn-primary" disabled>+ Nuevo</button>
        </section>

        <!-- Aviso de error de carga (con botón Reintentar) -->
        <div id="banner" class="banner" role="alert" hidden>
          <span id="banner-text"></span>
          <button id="banner-retry" class="btn btn-small btn-ghost">Reintentar</button>
        </div>

        <section class="card">
          <div class="table-wrap">
            <table id="table">
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <p id="state" class="state">Cargando…</p>
        </section>
        <p id="count" class="count" aria-live="polite"></p>
      </main>
    </div>
  </div>

  <!-- Modal: crear / editar (los campos se generan desde /api/meta) -->
  <dialog id="dlg-form" aria-labelledby="form-title">
    <form id="form" novalidate>
      <h2 id="form-title">Nuevo registro</h2>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div id="form-fields" class="fields"></div>
      <div class="dialog-actions">
        <button type="button" id="btn-cancel" class="btn btn-ghost">Cancelar</button>
        <button type="submit" id="btn-save" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal: confirmar eliminación -->
  <dialog id="dlg-delete" aria-labelledby="delete-title">
    <h2 id="delete-title">Eliminar registro</h2>
    <p id="delete-text"></p>
    <div class="dialog-actions">
      <button id="btn-delete-cancel" class="btn btn-ghost">Cancelar</button>
      <button id="btn-delete-ok" class="btn btn-danger">Sí, eliminar</button>
    </div>
  </dialog>

  <!-- Contenedor de alertas flotantes -->
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
